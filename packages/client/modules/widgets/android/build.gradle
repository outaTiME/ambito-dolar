plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'im.outa.ambitodolar'
version = '1.0.0'

// the font and the picker previews live once under packages/client/assets and are copied in as resources
def widgetGeneratedRes = layout.buildDirectory.dir('generated/res/widget')
def copyWidgetRes = tasks.register('copyWidgetRes', Copy) {
  into widgetGeneratedRes
  from("$projectDir/../../../assets/fonts/FiraGO-Regular.otf") {
    into 'font'
    rename { 'widget_firago_regular.otf' }
  }
  from("$projectDir/../../../assets/widgets") {
    include 'android-*-2x2.png'
    into 'drawable-nodpi'
    rename { "widget_${(it - 'android-' - '-2x2.png').replace('-', '_')}_preview.png" }
  }
}

android {
  namespace 'im.outa.ambitodolar.widgets'
  defaultConfig {
    // agp ignores both on a library but expo-autolinking fails without versionName
    versionCode 1
    versionName '1.0.0'
    // the endpoint app.config.ts reads, with no fallback so a build without it fails
    def apiUrl = System.getenv('API_URL')
    if (!apiUrl) {
      throw new GradleException('API_URL is missing from the build environment')
    }
    resValue 'string', 'widget_api_url', apiUrl
  }
  sourceSets {
    main {
      res.srcDir widgetGeneratedRes
    }
  }
}

dependencies {
  // the platform dialog becomes a full width bottom sheet on one ui, the appcompat one stays centered
  implementation 'androidx.appcompat:appcompat:1.7.1'

  // the periodic redraw, with the reboot, the network constraint and the unique work built in
  implementation 'androidx.work:work-runtime-ktx:2.10.1'
}

tasks.named('preBuild') {
  dependsOn(copyWidgetRes)
}
