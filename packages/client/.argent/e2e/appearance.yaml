steps:
  - echo: the theme follows light and dark and goes back to system
  - launch: im.outa.AmbitoDolar
  - await: { visible: { text: Oficial }, timeout: 30000 }
  - await: { idle: true }
  - tap: { text: Ajustes }
  - await: { visible: { text: Fechas relativas }, timeout: 15000 }
  - tap: { text: Apariencia }
  - await: { visible: { text: Tema } }
  - await: { idle: true }
  - tap: { text: Oscuro }
  - tap: { text: Claro }
  - tap: { text: Sistema }
  - await: { idle: true }
  - assert: { visible: { text: Tema } }
