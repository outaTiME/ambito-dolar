steps:
  - echo: a cold start, the rates list first
  - launch: im.outa.AmbitoDolar
  - await: { visible: { text: Oficial }, timeout: 30000 }
  - await: { idle: true }
  - tap: { text: Ajustes }
  - await: { visible: { text: Fechas relativas }, timeout: 15000 }
  - tap: { text: Donar }
  - echo: the four mock amounts of an unattended build show with their price
  - await: { visible: { text: Elegí tu aporte } }
  - await: { visible: { text: Pequeño }, timeout: 15000 }
  - assert: { visible: { text: Mediano } }
  - assert: { visible: { text: Grande } }
  - assert: { visible: { text: Enorme } }
  - assert: { visible: { text: 'US$0,99' } }
  - assert: { visible: { text: 'US$9,99' } }
