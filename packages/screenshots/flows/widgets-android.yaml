steps:
  - launch: im.outa.AmbitoDolar
  - echo: the app fetches the rates first, the widgets reload from the same data
  - await: { visible: { text: Oficial }, timeout: 30000 }
  - await: { idle: true, timeout: 20000 }
  - echo: home from the app lands on the last page shown, home again on the first one
  - tool: button
    args: { button: home }
  - wait: 1000
  - tool: button
    args: { button: home }
  - wait: 1000
  - echo: the widgets are alone on the second page, a raw swipe skips the settle a swipe step reads through the app in the background
  - tool: gesture-swipe
    args: { fromX: 0.9, fromY: 0.5, toX: 0.1, toY: 0.5 }
  - echo: the home screen is not the app, so no await reads it
  - wait: 3000
