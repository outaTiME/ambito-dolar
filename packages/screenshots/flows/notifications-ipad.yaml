steps:
  - launch: im.outa.AmbitoDolar
  - echo: a cold start fetches the rates before the list shows
  - await: { visible: { text: Oficial }, timeout: 30000 }
  - await: { idle: true, timeout: 20000 }
  - echo: the iPad tab bar shows icons only and exposes no name or id, its settings icon by position, landscape in portrait axes
  - tool: gesture-tap
    args: { x: 0.935, y: 0.560 }
  - await: { visible: { text: Notificaciones } }
  - tap: { text: Notificaciones }
  - echo: simulators show the settings without the permission, the shot shows the defaults
  - await: { visible: { text: Cierre de jornada } }
  - await: { idle: true, timeout: 20000 }
